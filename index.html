<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Мой заработок</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #16181C; --surface: #212429; --surface-hi: #2A2E35;
    --accent: #FFB020; --accent-dim: #8A6A2A; --good: #4FBE82; --bad: #E1614F;
    --text: #EDEFF2; --text-dim: #8B909A; --text-faint: #5A5F68; --line: #33373E;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  #root { max-width: 480px; margin: 0 auto; padding-bottom: 100px; position: relative; min-height: 100vh; }
  input, select, textarea, button { font-family: inherit; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { cursor: pointer; }
  .mono { font-family: 'SF Mono', 'Menlo', monospace; font-variant-numeric: tabular-nums; }
  .row { display:flex; }
  .card { background: var(--surface); border-radius: 14px; border: 1px solid var(--line); }
  .btn-primary { width:100%; padding:14px 0; border-radius:12px; border:none; background:var(--accent); color:#1A1300; font-weight:700; font-size:15px; margin-top:6px; }
  .field { margin-bottom: 14px; }
  .field-label { font-size:12px; color:var(--text-dim); margin-bottom:6px; }
  .input { width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-size:14px; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
  .modal-sheet { background: var(--surface); width:100%; max-width:480px; border-radius:22px 22px 0 0; padding:18px 20px 28px; max-height:88vh; overflow-y:auto; border:1px solid var(--line); border-bottom:none; }
  .icon-btn { background:var(--surface); border:1px solid var(--line); border-radius:8px; width:28px; height:28px; display:flex; align-items:center; justify-content:center; color:var(--text-dim); }
</style>
</head>
<body>
<div id="root"></div>
<div id="modal-root"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  try { tg.ready(); tg.expand(); tg.setHeaderColor("#16181C"); tg.setBackgroundColor("#16181C"); } catch (e) {}
}

const storage = {
  get(key) {
    return new Promise((resolve) => {
      if (tg && tg.CloudStorage) tg.CloudStorage.getItem(key, (err, value) => resolve(err ? null : value || null));
      else resolve(localStorage.getItem(key));
    });
  },
  set(key, value) {
    return new Promise((resolve) => {
      if (tg && tg.CloudStorage) tg.CloudStorage.setItem(key, value, () => resolve(true));
      else { localStorage.setItem(key, value); resolve(true); }
    });
  },
};

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function pad(n) { return n.toString().padStart(2, "0"); }
function todayISO() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function fmtDateShort(iso) {
  const [y,m,d] = iso.split("-").map(Number);
  const date = new Date(y, m-1, d);
  const days = ["вс","пн","вт","ср","чт","пт","сб"];
  return `${pad(d)}.${pad(m)}, ${days[date.getDay()]}`;
}
function minutesBetween(start, end) {
  const [sh,sm] = start.split(":").map(Number);
  const [eh,em] = end.split(":").map(Number);
  let total = eh*60+em - (sh*60+sm);
  if (total < 0) total += 24*60;
  return total;
}
function fmtHours(mins) { const h = Math.floor(mins/60); const m = mins%60; return m===0 ? `${h} ч` : `${h} ч ${m} мин`; }
function fmtMoney(n) { return Math.round(n).toLocaleString("ru-RU") + " ₽"; }
function fmtPct(n) { const sign = n>0 ? "+" : ""; return `${sign}${Math.round(n)}%`; }
function mondayOf(ref) { const day=(ref.getDay()+6)%7; const monday=new Date(ref); monday.setDate(ref.getDate()-day); monday.setHours(0,0,0,0); return monday; }
function isInWeek(iso, refDate) {
  const d = new Date(iso); const monday = mondayOf(refDate);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6); sunday.setHours(23,59,59,999);
  return d >= monday && d <= sunday;
}
function isInMonth(iso, refDate) { const d = new Date(iso); return d.getFullYear()===refDate.getFullYear() && d.getMonth()===refDate.getMonth(); }
function esc(s) { const d = document.createElement("div"); d.innerText = s == null ? "" : String(s); return d.innerHTML; }

const RANGES = [{key:"week",label:"Неделя"},{key:"month",label:"Месяц"},{key:"all",label:"Всё время"}];
const WEEKDAYS = ["пн","вт","ср","чт","пт","сб","вс"];
function weekdayIndexMon0(iso) { const d = new Date(iso); return (d.getDay()+6)%7; }

// ---------------- state ----------------
let shifts = [];
let settings = { amortRate: 5 };
let goal = { name: "", amount: 0 };
let range = "week";
let refDate = new Date();
let loading = true;
let errorMsg = "";

function amortFor(s) { return (s.distance || 0) * (settings.amortRate || 0); }
function netFor(s) { return s.earnings - (s.expenses || 0) - amortFor(s); }
function sumNet(list) { return list.reduce((a,s) => a + netFor(s), 0); }

function getFiltered() {
  if (range === "all") return shifts;
  if (range === "week") return shifts.filter(s => isInWeek(s.date, refDate));
  return shifts.filter(s => isInMonth(s.date, refDate));
}
function getPrevFiltered() {
  if (range === "all") return [];
  const prevRef = new Date(refDate);
  if (range === "week") prevRef.setDate(prevRef.getDate()-7); else prevRef.setMonth(prevRef.getMonth()-1);
  return range === "week" ? shifts.filter(s=>isInWeek(s.date,prevRef)) : shifts.filter(s=>isInMonth(s.date,prevRef));
}
function getStats(filtered) {
  let earnings=0, expenses=0, amort=0, mins=0, orders=0, distance=0;
  filtered.forEach(s => {
    earnings += s.earnings; expenses += s.expenses||0; amort += amortFor(s);
    mins += minutesBetween(s.start, s.end); orders += s.orders||0; distance += s.distance||0;
  });
  const net = earnings - expenses - amort;
  const hours = mins/60;
  return { earnings, expenses, amort, net, mins, orders, distance,
    perHour: hours>0 ? net/hours : 0, perOrder: orders>0 ? net/orders : 0,
    perKm: distance>0 ? expenses/distance : 0, kmPerOrder: orders>0 ? distance/orders : 0,
    shiftCount: filtered.length };
}
function getComparison(filtered, prevFiltered) {
  if (range === "all") return null;
  const curr = sumNet(filtered), prev = sumNet(prevFiltered);
  if (prev === 0) return curr === 0 ? null : { pct: null, curr, prev };
  return { pct: ((curr-prev)/Math.abs(prev))*100, curr, prev };
}
function getByWeekday(filtered) {
  const buckets = Array.from({length:7}, () => ({sum:0,count:0}));
  filtered.forEach(s => { const idx = weekdayIndexMon0(s.date); buckets[idx].sum += netFor(s); buckets[idx].count += 1; });
  const withData = buckets.map((b,i) => ({ day: WEEKDAYS[i], avg: b.count>0 ? b.sum/b.count : 0, count: b.count }));
  const maxAvg = Math.max(1, ...withData.map(d=>d.avg));
  const best = withData.filter(d=>d.count>0).sort((a,b)=>b.avg-a.avg)[0];
  return { withData, maxAvg, best };
}
function getLast7() {
  const days = [];
  for (let i=6;i>=0;i--) {
    const d = new Date(); d.setDate(d.getDate()-i);
    const iso = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const dayShifts = shifts.filter(s=>s.date===iso);
    const net = dayShifts.reduce((a,s)=>a+netFor(s),0);
    days.push({ iso, net, label: ["вс","пн","вт","ср","чт","пт","сб"][d.getDay()] });
  }
  return days;
}
function getMonthProgress() {
  const now = new Date();
  return sumNet(shifts.filter(s => isInMonth(s.date, now)));
}
function periodLabel() {
  if (range === "all") return "За всё время";
  if (range === "week") {
    const monday = mondayOf(refDate); const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
    return `${pad(monday.getDate())}.${pad(monday.getMonth()+1)} – ${pad(sunday.getDate())}.${pad(sunday.getMonth()+1)}`;
  }
  return refDate.toLocaleDateString("ru-RU", { month: "long", year: "numeric" });
}

// ---------------- persistence ----------------
async function persistShifts() {
  try { await storage.set("courier_shifts", JSON.stringify(shifts)); }
  catch { errorMsg = "Не удалось сохранить данные"; render(); setTimeout(()=>{errorMsg="";render();},3000); }
}
async function persistSettings() { try { await storage.set("courier_settings", JSON.stringify(settings)); } catch {} }
async function persistGoal() { try { await storage.set("courier_goal", JSON.stringify(goal)); } catch {} }

function addOrUpdateShift(shift, editingId) {
  if (editingId) shifts = shifts.map(s => s.id===editingId ? shift : s);
  else shifts = [...shifts, shift];
  shifts.sort((a,b) => (a.date+a.start).localeCompare(b.date+b.start));
  persistShifts();
  if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
  render();
}
function deleteShift(id) {
  shifts = shifts.filter(s => s.id !== id);
  persistShifts();
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
  render();
}

// ---------------- rendering ----------------
function render() {
  const root = document.getElementById("root");
  if (loading) { root.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text-dim)">Загрузка...</div>`; return; }

  const filtered = getFiltered();
  const prevFiltered = getPrevFiltered();
  const stats = getStats(filtered);
  const comparison = getComparison(filtered, prevFiltered);
  const byWeekday = getByWeekday(filtered);
  const last7 = getLast7();
  const maxDay = Math.max(1, ...last7.map(d=>d.net));
  const monthProgress = getMonthProgress();
  const goalPct = goal.amount>0 ? Math.min(100, (monthProgress/goal.amount)*100) : 0;

  root.innerHTML = `
    <div style="padding:22px 20px 16px;display:flex;justify-content:space-between;align-items:flex-start">
      <div>
        <div style="display:flex;align-items:baseline;gap:8px">
          <span style="font-size:13px;letter-spacing:.08em;color:var(--accent);font-weight:600;text-transform:uppercase">Смены</span>
          <span style="font-size:13px;color:var(--text-faint)">· Яндекс, авто</span>
        </div>
        <div style="font-size:24px;font-weight:700;margin-top:4px">Мой заработок</div>
      </div>
      <button id="btn-settings" class="icon-btn" style="width:36px;height:36px;font-size:16px">⚙</button>
    </div>

    <div style="display:flex;gap:6px;padding:0 20px;margin-bottom:14px">
      ${RANGES.map(r => `<button class="range-btn" data-range="${r.key}" style="flex:1;padding:8px 0;border-radius:10px;border:none;background:${range===r.key?"var(--accent)":"var(--surface)"};color:${range===r.key?"#1A1300":"var(--text-dim)"};font-weight:600;font-size:13px">${r.label}</button>`).join("")}
    </div>

    ${range!=="all" ? `
    <div style="display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:16px;color:var(--text-dim);font-size:13px">
      <button id="btn-prev" class="icon-btn">‹</button>
      <span style="min-width:140px;text-align:center;text-transform:capitalize">${periodLabel()}</span>
      <button id="btn-next" class="icon-btn">›</button>
    </div>` : ""}

    <div style="padding:0 20px;margin-bottom:14px">
      <div style="background:linear-gradient(155deg, var(--surface-hi), var(--surface));border-radius:20px;padding:22px 20px;border:1px solid var(--line)">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div>
            <div style="font-size:12px;color:var(--text-dim);margin-bottom:6px;letter-spacing:.04em">ЧИСТЫМИ</div>
            <div class="mono" style="font-size:38px;font-weight:700;color:${stats.net>=0?"var(--text)":"var(--bad)"};letter-spacing:-.02em">${fmtMoney(stats.net)}</div>
          </div>
          ${comparison && comparison.pct!==null ? `
          <div style="display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:8px;background:${comparison.pct>=0?"rgba(79,190,130,.14)":"rgba(225,97,79,.14)"};color:${comparison.pct>=0?"var(--good)":"var(--bad)"};font-size:12px;font-weight:700;margin-top:4px">
            ${comparison.pct>=0?"▲":"▼"} ${fmtPct(comparison.pct)}
          </div>` : ""}
        </div>
        <div style="display:flex;gap:16px;margin-top:14px;flex-wrap:wrap">
          ${miniStat("в час", stats.perHour>0?fmtMoney(stats.perHour):"—")}
          ${miniStat("заказов", stats.orders || "—")}
          ${miniStat("смен", stats.shiftCount || "—")}
        </div>
        ${comparison ? `<div style="font-size:11px;color:var(--text-faint);margin-top:10px">${range==="week"?"Прошлая неделя":"Прошлый месяц"}: ${fmtMoney(comparison.prev)}</div>` : ""}
      </div>
    </div>

    <div style="padding:0 20px;margin-bottom:20px">
      <div id="goal-card" class="card" style="padding:14px 16px;cursor:pointer">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <span style="font-size:12px;color:var(--text-dim);letter-spacing:.04em">🎯 ЦЕЛЬ НА МЕСЯЦ${goal.name?`: ${esc(goal.name.toUpperCase())}`:""}</span>
          <span style="font-size:12px;color:var(--text-faint)">${Math.round(goalPct)}%</span>
        </div>
        ${goal.amount>0 ? `
          <div style="height:8px;border-radius:4px;background:var(--bg);overflow:hidden">
            <div style="height:100%;width:${goalPct}%;border-radius:4px;background:var(--accent)"></div>
          </div>
          <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--text-dim)">
            <span>${fmtMoney(monthProgress)}</span><span>${fmtMoney(goal.amount)}</span>
          </div>` : `<div style="font-size:13px;color:var(--text-faint)">Нажми, чтобы поставить цель на месяц</div>`}
      </div>
    </div>

    <div style="padding:0 20px;margin-bottom:20px">
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:10px;letter-spacing:.04em">ПОСЛЕДНИЕ 7 ДНЕЙ</div>
      <div class="card" style="display:flex;align-items:flex-end;gap:8px;height:90px;padding:12px 12px 8px">
        ${last7.map(d => `
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end">
            <div style="width:100%;max-width:26px;border-radius:5px;height:${Math.max(4,(d.net/maxDay)*56)}px;background:${d.net>0?"var(--accent)":"var(--line)"}"></div>
            <span style="font-size:10px;color:var(--text-faint)">${d.label}</span>
          </div>`).join("")}
      </div>
    </div>

    ${byWeekday.withData.some(d=>d.count>0) ? `
    <div style="padding:0 20px;margin-bottom:20px">
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:10px;letter-spacing:.04em">СРЕДНИЙ ДОХОД ПО ДНЯМ НЕДЕЛИ</div>
      <div class="card" style="padding:14px 16px">
        ${byWeekday.best ? `<div style="font-size:13px;margin-bottom:12px">Выгоднее всего работать в <b style="color:var(--accent)">${byWeekday.best.day}</b> — в среднем ${fmtMoney(byWeekday.best.avg)} за смену</div>` : ""}
        <div style="display:flex;align-items:flex-end;gap:8px;height:70px">
          ${byWeekday.withData.map(d => `
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end">
              <div style="width:100%;max-width:26px;border-radius:5px;height:${d.count>0?Math.max(4,(d.avg/byWeekday.maxAvg)*44):2}px;background:${d.count>0?(byWeekday.best&&d.day===byWeekday.best.day?"var(--accent)":"var(--accent-dim)"):"var(--line)"}"></div>
              <span style="font-size:10px;color:var(--text-faint)">${d.day}</span>
            </div>`).join("")}
        </div>
      </div>
    </div>` : ""}

    ${stats.distance>0 ? `
    <div style="padding:0 20px;margin-bottom:20px">
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:10px;letter-spacing:.04em">ЭКОНОМИКА ПОЕЗДОК</div>
      <div class="card" style="padding:14px 16px;display:flex;gap:16px;flex-wrap:wrap">
        ${miniStat("пройдено", `${Math.round(stats.distance)} км`)}
        ${miniStat("км / заказ", stats.kmPerOrder>0?stats.kmPerOrder.toFixed(1):"—")}
        ${miniStat("бензин / км", stats.perKm>0?`${stats.perKm.toFixed(1)} ₽`:"—")}
        ${miniStat("износ авто", stats.amort>0?fmtMoney(stats.amort):"—")}
      </div>
    </div>` : ""}

    <div style="padding:0 20px">
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:10px;letter-spacing:.04em">ЗАПИСИ</div>
      ${filtered.length===0 ? `
        <div style="text-align:center;padding:30px 10px;color:var(--text-faint);font-size:14px;background:var(--surface);border-radius:14px;border:1px dashed var(--line)">
          Пока нет смен за этот период.<br/>Нажми «+», чтобы добавить первую.
        </div>` : `
        <div style="display:flex;flex-direction:column;gap:8px">
          ${[...filtered].reverse().map(s => {
            const mins = minutesBetween(s.start, s.end);
            const net = netFor(s);
            const amort = amortFor(s);
            return `
            <div class="shift-row card" data-id="${s.id}" style="padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer">
              <div style="flex:1;min-width:0">
                <div style="font-size:14px;font-weight:600">${fmtDateShort(s.date)}</div>
                <div style="font-size:12px;color:var(--text-dim);margin-top:2px">
                  ${s.start}–${s.end} · ${fmtHours(mins)}${s.orders?` · ${s.orders} зак.`:""}${s.distance?` · ${s.distance} км`:""}
                </div>
              </div>
              <div style="text-align:right">
                <div class="mono" style="font-size:16px;font-weight:700">${fmtMoney(net)}</div>
                ${(s.expenses>0||amort>0) ? `<div style="font-size:11px;color:var(--bad);margin-top:1px">−${fmtMoney((s.expenses||0)+amort)} ${s.expenses>0&&amort>0?"(бенз.+износ)":amort>0?"износ":"бенз."}</div>` : ""}
              </div>
              <button class="delete-btn" data-id="${s.id}" style="background:none;border:none;padding:6px;color:var(--text-faint);font-size:15px;flex-shrink:0">✕</button>
            </div>`;
          }).join("")}
        </div>`}
    </div>

    ${errorMsg ? `<div style="position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;padding:8px 16px;border-radius:10px;font-size:13px">${esc(errorMsg)}</div>` : ""}

    <button id="btn-fab" style="position:fixed;bottom:24px;right:calc(50% - 190px);width:56px;height:56px;border-radius:28px;background:var(--accent);border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(255,176,32,.35);font-size:26px;color:#1A1300">+</button>
  `;

  attachMainHandlers();
}

function miniStat(label, value) {
  return `<div style="display:flex;flex-direction:column;gap:4px">
    <span style="font-size:11px;color:var(--text-dim)">${label}</span>
    <span class="mono" style="font-size:14px;font-weight:600">${value}</span>
  </div>`;
}

function attachMainHandlers() {
  document.getElementById("btn-settings").onclick = openSettings;
  document.querySelectorAll(".range-btn").forEach(btn => {
    btn.onclick = () => { range = btn.dataset.range; render(); };
  });
  const prevBtn = document.getElementById("btn-prev");
  const nextBtn = document.getElementById("btn-next");
  if (prevBtn) prevBtn.onclick = () => shiftPeriod(-1);
  if (nextBtn) nextBtn.onclick = () => shiftPeriod(1);
  document.getElementById("goal-card").onclick = openSettings;
  document.getElementById("btn-fab").onclick = () => openForm(null);
  document.querySelectorAll(".shift-row").forEach(row => {
    row.addEventListener("click", (e) => {
      if (e.target.closest(".delete-btn")) return;
      const s = shifts.find(x => x.id === row.dataset.id);
      openForm(s);
    });
  });
  document.querySelectorAll(".delete-btn").forEach(btn => {
    btn.addEventListener("click", (e) => { e.stopPropagation(); deleteShift(btn.dataset.id); });
  });
}

function shiftPeriod(dir) {
  const d = new Date(refDate);
  if (range === "week") d.setDate(d.getDate()+dir*7); else if (range === "month") d.setMonth(d.getMonth()+dir);
  refDate = d;
  render();
}

// ---------------- form modal ----------------
function openForm(initial) {
  const modalRoot = document.getElementById("modal-root");
  const editingId = initial ? initial.id : null;
  modalRoot.innerHTML = `
    <div class="modal-overlay" id="form-overlay">
      <div class="modal-sheet" id="form-sheet">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
          <div style="font-size:17px;font-weight:700">${initial ? "Изменить смену" : "Новая смена"}</div>
          <button id="form-close" style="background:none;border:none;font-size:18px;color:var(--text-dim)">✕</button>
        </div>
        <div class="field"><div class="field-label">Дата</div><input class="input" type="date" id="f-date" value="${initial?.date || todayISO()}"></div>
        <div style="display:flex;gap:10px">
          <div class="field" style="flex:1"><div class="field-label">Начало</div><input class="input" type="time" id="f-start" value="${initial?.start || "18:00"}"></div>
          <div class="field" style="flex:1"><div class="field-label">Конец</div><input class="input" type="time" id="f-end" value="${initial?.end || "22:00"}"></div>
        </div>
        <div class="field"><div class="field-label">Заработано, ₽</div><input class="input" type="number" inputmode="decimal" placeholder="напр. 2500" id="f-earnings" value="${initial?.earnings ?? ""}"></div>
        <div style="display:flex;gap:10px">
          <div class="field" style="flex:1"><div class="field-label">Заказов</div><input class="input" type="number" inputmode="numeric" placeholder="—" id="f-orders" value="${initial?.orders ?? ""}"></div>
          <div class="field" style="flex:1"><div class="field-label">Бензин, ₽</div><input class="input" type="number" inputmode="decimal" placeholder="—" id="f-expenses" value="${initial?.expenses ?? ""}"></div>
        </div>
        <div class="field">
          <div class="field-label">Пробег за смену, км</div>
          <input class="input" type="number" inputmode="decimal" placeholder="—" id="f-distance" value="${initial?.distance ?? ""}">
          <div style="font-size:11px;color:var(--text-faint);margin-top:4px">Считаем износ авто отдельно от бензина — ставку меняешь в настройках (⚙)</div>
        </div>
        <div class="field">
          <div class="field-label">Заметка (не обязательно)</div>
          <textarea class="input" id="f-notes" rows="2" placeholder="напр. дождь, мало заказов...">${initial?.notes ? esc(initial.notes) : ""}</textarea>
        </div>
        <div id="f-error" style="color:var(--bad);font-size:12px;margin-bottom:10px;display:none">Заполни дату, время и сумму заработка.</div>
        <button class="btn-primary" id="f-submit">${initial ? "Сохранить изменения" : "Добавить смену"}</button>
      </div>
    </div>`;

  document.getElementById("form-overlay").addEventListener("click", (e) => { if (e.target.id === "form-overlay") closeModal(); });
  document.getElementById("form-close").onclick = closeModal;
  document.getElementById("f-submit").onclick = () => {
    const date = document.getElementById("f-date").value;
    const start = document.getElementById("f-start").value;
    const end = document.getElementById("f-end").value;
    const earnings = parseFloat(document.getElementById("f-earnings").value);
    const valid = date && start && end && !isNaN(earnings);
    if (!valid) { document.getElementById("f-error").style.display = "block"; return; }
    const shift = {
      id: editingId || uid(), date, start, end, earnings: earnings || 0,
      orders: parseInt(document.getElementById("f-orders").value) || 0,
      expenses: parseFloat(document.getElementById("f-expenses").value) || 0,
      distance: parseFloat(document.getElementById("f-distance").value) || 0,
      notes: document.getElementById("f-notes").value.trim(),
    };
    addOrUpdateShift(shift, editingId);
    closeModal();
  };
}

function openSettings() {
  const modalRoot = document.getElementById("modal-root");
  modalRoot.innerHTML = `
    <div class="modal-overlay" id="settings-overlay">
      <div class="modal-sheet">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
          <div style="font-size:17px;font-weight:700">Настройки</div>
          <button id="settings-close" style="background:none;border:none;font-size:18px;color:var(--text-dim)">✕</button>
        </div>
        <div style="font-size:12px;color:var(--text-dim);margin-bottom:10px;letter-spacing:.04em">ЦЕЛЬ НА МЕСЯЦ</div>
        <div class="field"><div class="field-label">Название цели (не обязательно)</div><input class="input" type="text" id="s-goal-name" placeholder="напр. на новую резину" value="${goal.name ? esc(goal.name) : ""}"></div>
        <div class="field"><div class="field-label">Сумма, ₽</div><input class="input" type="number" inputmode="decimal" placeholder="напр. 40000" id="s-goal-amount" value="${goal.amount || ""}"></div>
        <div style="font-size:12px;color:var(--text-dim);margin:16px 0 10px;letter-spacing:.04em">ИЗНОС АВТО</div>
        <div class="field">
          <div class="field-label">Ставка амортизации, ₽ за км</div>
          <input class="input" type="number" inputmode="decimal" id="s-amort" value="${settings.amortRate ?? 5}">
          <div style="font-size:11px;color:var(--text-faint);margin-top:4px">Обычно 3–8 ₽/км в зависимости от машины.</div>
        </div>
        <button class="btn-primary" id="s-submit">Сохранить</button>
      </div>
    </div>`;

  document.getElementById("settings-overlay").addEventListener("click", (e) => { if (e.target.id === "settings-overlay") closeModal(); });
  document.getElementById("settings-close").onclick = closeModal;
  document.getElementById("s-submit").onclick = () => {
    settings = { amortRate: parseFloat(document.getElementById("s-amort").value) || 0 };
    goal = { name: document.getElementById("s-goal-name").value.trim(), amount: parseFloat(document.getElementById("s-goal-amount").value) || 0 };
    persistSettings(); persistGoal();
    closeModal();
    render();
  };
}

function closeModal() { document.getElementById("modal-root").innerHTML = ""; }

// ---------------- init ----------------
(async () => {
  try { const v = await storage.get("courier_shifts"); shifts = v ? JSON.parse(v) : []; } catch { shifts = []; }
  try { const v = await storage.get("courier_settings"); if (v) settings = JSON.parse(v); } catch {}
  try { const v = await storage.get("courier_goal"); if (v) goal = JSON.parse(v); } catch {}
  loading = false;
  render();
})();
</script>
</body>
</html>
