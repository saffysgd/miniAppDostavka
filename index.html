<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Мой заработок</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #16181C; --surface: #212429; --surface-hi: #2A2E35;
    --accent: #FFB020; --accent-dim: #8A6A2A; --good: #4FBE82; --bad: #E1614F;
    --text: #EDEFF2; --text-dim: #8B909A; --text-faint: #5A5F68; --line: #33373E;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  #root { max-width: 480px; margin: 0 auto; padding-bottom: 100px; position: relative; min-height: 100vh; }
  input, select, textarea, button { font-family: inherit; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { cursor: pointer; }
  .mono { font-family: 'SF Mono', 'Menlo', monospace; font-variant-numeric: tabular-nums; }
  .row { display:flex; }
  .card { background: var(--surface); border-radius: 14px; border: 1px solid var(--line); }
  .btn-primary { width:100%; padding:14px 0; border-radius:12px; border:none; background:var(--accent); color:#1A1300; font-weight:700; font-size:15px; margin-top:6px; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .field { margin-bottom: 14px; min-width: 0; }
  .field-label { font-size:12px; color:var(--text-dim); margin-bottom:6px; }
  .input { width:100%; min-width: 0; padding:11px 12px; border-radius:10px; border:1.5px solid #3D424B; background:#1B1E23; color:var(--text); font-size:14px; }
  .input.error { border-color: var(--bad); outline-color: var(--bad); }
  .input-wrap { position: relative; }
  .input-wrap .fake-display { pointer-events: none; box-sizing: border-box; }
  .input-wrap .overlay-input {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; border: none; margin: 0; padding: 0;
    -webkit-appearance: none; appearance: none; background: transparent;
  }
  .input-hint { font-size:11px; color:var(--text-faint); margin-top:4px; }
  .input-hint.error { color: var(--bad); }
  .form-row { display:flex; gap:18px; min-width:0; }
  .form-row > .field { flex:1; min-width:0; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
  .modal-sheet { background: var(--surface); width:100%; max-width:480px; border-radius:22px 22px 0 0; padding:18px 20px 28px; max-height:88vh; overflow-y:auto; overflow-x:hidden; border:1px solid var(--line); border-bottom:none; box-sizing:border-box; }
  .icon-btn { background:var(--surface); border:1px solid var(--line); border-radius:8px; width:28px; height:28px; display:flex; align-items:center; justify-content:center; color:var(--text-dim); }
  .toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--bad); color:#fff; padding:8px 16px; border-radius:10px; font-size:13px; z-index:100; }
  .toast.success { background: var(--good); }
  .confirm-sheet { text-align:center; padding: 24px 20px 20px; }
  .confirm-sheet p { font-size:14px; color:var(--text-dim); margin: 8px 0 20px; }
  .confirm-btns { display:flex; gap:10px; }
  .btn-secondary { flex:1; padding:12px 0; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--text); font-weight:600; font-size:14px; }
  .btn-danger { flex:1; padding:12px 0; border-radius:10px; border:none; background:var(--bad); color:#fff; font-weight:600; font-size:14px; }
  .export-btn { display:block; width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-size:14px; text-align:center; text-decoration:none; margin-bottom:10px; }
  .shift-row-wrap { position:relative; overflow:hidden; border-radius:14px; }
  .shift-row-wrap .shift-row { position:relative; z-index:2; touch-action: pan-y; will-change: transform; }
  .shift-delete-btn {
    position:absolute; inset:0; left:auto; width:84px; z-index:1;
    background:var(--bad); border:none; color:#fff; font-size:11px; font-weight:600;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    border-radius:0 14px 14px 0;
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="modal-root"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  try { tg.ready(); tg.expand(); tg.setHeaderColor("#16181C"); tg.setBackgroundColor("#16181C"); } catch (e) {}
}

const storage = {
  get(key) {
    return new Promise((resolve) => {
      if (tg && tg.CloudStorage) tg.CloudStorage.getItem(key, (err, value) => resolve(err ? null : value || null));
      else resolve(localStorage.getItem(key));
    });
  },
  set(key, value) {
    return new Promise((resolve) => {
      if (tg && tg.CloudStorage) tg.CloudStorage.setItem(key, value, () => resolve(true));
      else { localStorage.setItem(key, value); resolve(true); }
    });
  },
  remove(key) {
    return new Promise((resolve) => {
      if (tg && tg.CloudStorage) tg.CloudStorage.removeItem(key, () => resolve(true));
      else { localStorage.removeItem(key); resolve(true); }
    });
  },
};

// ===================== COMPACT STORAGE FORMAT =====================
// Каждая смена хранится не объектом ({"date":...,"start":...}), а массивом
// без имён полей — это само по себе экономит ~55%. Поверх этого страницы
// смен сжимаются gzip'ом (встроенный CompressionStream, без библиотек) —
// суммарно экономия ~80-85% по сравнению с обычным JSON.
const HAS_COMPRESSION = typeof CompressionStream !== "undefined";
const PAGE_SIZE = 100; // смен на одну "страницу"/ключ хранилища

function arrayBufferToBase64(buf) {
  let binary = "";
  const bytes = new Uint8Array(buf);
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  return btoa(binary);
}
function base64ToArrayBuffer(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}
async function gzipCompress(str) {
  const stream = new Blob([str]).stream().pipeThrough(new CompressionStream("gzip"));
  const buf = await new Response(stream).arrayBuffer();
  return arrayBufferToBase64(buf);
}
async function gzipDecompress(b64) {
  const buf = base64ToArrayBuffer(b64);
  const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
  return await new Response(stream).text();
}
// "1:<base64>" — сжато gzip; "0:<json>" — просто компактный JSON без сжатия (фолбэк для старых браузеров)
async function encodePayload(str) {
  if (HAS_COMPRESSION) { try { return "1:" + await gzipCompress(str); } catch { /* fallback below */ } }
  return "0:" + str;
}
async function decodePayload(raw) {
  const tag = raw.slice(0, 2);
  const body = raw.slice(2);
  if (tag === "1:") return await gzipDecompress(body);
  if (tag === "0:") return body;
  return raw; // на случай неожиданного формата — вернуть как есть
}

function encodeDateCompact(iso) { return iso.replace(/-/g, ""); }
function decodeDateCompact(c) { return `${c.slice(0,4)}-${c.slice(4,6)}-${c.slice(6,8)}`; }
function encodeTimeCompact(hhmm) { return hhmm.replace(":", ""); }
function decodeTimeCompact(c) { return `${c.slice(0,2)}:${c.slice(2,4)}`; }

function toCompactShift(s) {
  return [s.id, encodeDateCompact(s.date), encodeTimeCompact(s.start), encodeTimeCompact(s.end),
    s.earnings, s.orders||0, s.expenses||0, s.distance||0, s.notes||""];
}
function fromCompactShift(a) {
  return { id:a[0], date:decodeDateCompact(a[1]), start:decodeTimeCompact(a[2]), end:decodeTimeCompact(a[3]),
    earnings:a[4], orders:a[5], expenses:a[6], distance:a[7], notes:a[8] };
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function pad(n) { return n.toString().padStart(2, "0"); }
function todayISO() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
const MONTHS_RU = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
function formatDateHuman(iso) {
  const [y,m,d] = iso.split("-").map(Number);
  if (!y || !m || !d) return iso;
  return `${d} ${MONTHS_RU[m-1]} ${y}`;
}
function fmtDateShort(iso) {
  const [y,m,d] = iso.split("-").map(Number);
  const date = new Date(y, m-1, d);
  const days = ["вс","пн","вт","ср","чт","пт","сб"];
  return `${pad(d)}.${pad(m)}, ${days[date.getDay()]}`;
}
function minutesBetween(start, end) {
  const [sh,sm] = start.split(":").map(Number);
  const [eh,em] = end.split(":").map(Number);
  let total = eh*60+em - (sh*60+sm);
  if (total < 0) total += 24*60;
  return total;
}
function fmtHours(mins) { const h = Math.floor(mins/60); const m = mins%60; return m===0 ? `${h} ч` : `${h} ч ${m} мин`; }
function fmtMoney(n) { return Math.round(n).toLocaleString("ru-RU") + " ₽"; }
function fmtPct(n) { const sign = n>0 ? "+" : ""; return `${sign}${Math.round(n)}%`; }
function mondayOf(ref) { const day=(ref.getDay()+6)%7; const monday=new Date(ref); monday.setDate(ref.getDate()-day); monday.setHours(0,0,0,0); return monday; }
function isInWeek(iso, refDate) {
  const d = new Date(iso); const monday = mondayOf(refDate);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6); sunday.setHours(23,59,59,999);
  return d >= monday && d <= sunday;
}
function isInMonth(iso, refDate) { const d = new Date(iso); return d.getFullYear()===refDate.getFullYear() && d.getMonth()===refDate.getMonth(); }
function esc(s) { const d = document.createElement("div"); d.innerText = s == null ? "" : String(s); return d.innerHTML; }

const RANGES = [{key:"week",label:"Неделя"},{key:"month",label:"Месяц"},{key:"all",label:"Всё время"}];
const WEEKDAYS = ["пн","вт","ср","чт","пт","сб","вс"];
function weekdayIndexMon0(iso) { const d = new Date(iso); return (d.getDay()+6)%7; }

// ===================== STATE =====================
let shifts = [];
let settings = { amortRate: 5 };
let goal = { name: "", amount: 0 };
let range = "week";
let refDate = new Date();
let loading = true;
let errorMsg = "";
let toastTimeout;

function amortFor(s) { return (s.distance || 0) * (settings.amortRate || 0); }
function netFor(s) { return s.earnings - (s.expenses || 0) - amortFor(s); }
function sumNet(list) { return list.reduce((a,s) => a + netFor(s), 0); }

function getFiltered() {
  if (range === "all") return shifts;
  if (range === "week") return shifts.filter(s => isInWeek(s.date, refDate));
  return shifts.filter(s => isInMonth(s.date, refDate));
}
function getPrevFiltered() {
  if (range === "all") return [];
  const prevRef = new Date(refDate);
  if (range === "week") prevRef.setDate(prevRef.getDate()-7); else prevRef.setMonth(prevRef.getMonth()-1);
  return range === "week" ? shifts.filter(s=>isInWeek(s.date,prevRef)) : shifts.filter(s=>isInMonth(s.date,prevRef));
}
function getStats(filtered) {
  let earnings=0, expenses=0, amort=0, mins=0, orders=0, distance=0;
  filtered.forEach(s => {
    earnings += s.earnings; expenses += s.expenses||0; amort += amortFor(s);
    mins += minutesBetween(s.start, s.end); orders += s.orders||0; distance += s.distance||0;
  });
  const net = earnings - expenses - amort;
  const hours = mins/60;
  return { earnings, expenses, amort, net, mins, orders, distance,
    perHour: hours>0 ? net/hours : 0, perOrder: orders>0 ? net/orders : 0,
    perKm: distance>0 ? expenses/distance : 0, kmPerOrder: orders>0 ? distance/orders : 0,
    shiftCount: filtered.length };
}
function getComparison(filtered, prevFiltered) {
  if (range === "all") return null;
  const curr = sumNet(filtered), prev = sumNet(prevFiltered);
  if (prev === 0) return curr === 0 ? null : { pct: null, curr, prev };
  return { pct: ((curr-prev)/Math.abs(prev))*100, curr, prev };
}
function getByWeekday(filtered) {
  const buckets = Array.from({length:7}, () => ({sum:0,count:0}));
  filtered.forEach(s => { const idx = weekdayIndexMon0(s.date); buckets[idx].sum += netFor(s); buckets[idx].count += 1; });
  const withData = buckets.map((b,i) => ({ day: WEEKDAYS[i], avg: b.count>0 ? b.sum/b.count : 0, count: b.count }));
  const maxAvg = Math.max(1, ...withData.map(d=>d.avg));
  const best = withData.filter(d=>d.count>0).sort((a,b)=>b.avg-a.avg)[0];
  return { withData, maxAvg, best };
}
function getLast7() {
  const days = [];
  for (let i=6;i>=0;i--) {
    const d = new Date(); d.setDate(d.getDate()-i);
    const iso = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const dayShifts = shifts.filter(s=>s.date===iso);
    const net = dayShifts.reduce((a,s)=>a+netFor(s),0);
    days.push({ iso, net, label: ["вс","пн","вт","ср","чт","пт","сб"][d.getDay()] });
  }
  return days;
}
function getMonthProgress() {
  const now = new Date();
  return sumNet(shifts.filter(s => isInMonth(s.date, now)));
}
function periodLabel() {
  if (range === "all") return "За всё время";
  if (range === "week") {
    const monday = mondayOf(refDate); const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
    return `${pad(monday.getDate())}.${pad(monday.getMonth()+1)} – ${pad(sunday.getDate())}.${pad(sunday.getMonth()+1)}`;
  }
  return refDate.toLocaleDateString("ru-RU", { month: "long", year: "numeric" });
}

// ===================== PERSISTENCE =====================
let saveTimeout;
let lastPageCount = 0;
function persistShiftsDebounced() {
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(persistShifts, 400);
}
async function persistShifts() {
  try {
    const compact = shifts.map(toCompactShift);
    const pages = [];
    for (let i = 0; i < compact.length; i += PAGE_SIZE) pages.push(compact.slice(i, i + PAGE_SIZE));
    if (pages.length === 0) pages.push([]); // хотя бы одна (пустая) страница, чтобы явно затереть старые данные

    for (let i = 0; i < pages.length; i++) {
      const encoded = await encodePayload(JSON.stringify(pages[i]));
      await storage.set(`courier_shifts_p${i}`, encoded);
    }
    // подчистить страницы, оставшиеся от прошлого сохранения (если смен стало меньше)
    for (let i = pages.length; i < lastPageCount; i++) await storage.remove(`courier_shifts_p${i}`);
    lastPageCount = pages.length;

    await storage.set("courier_shifts_meta", JSON.stringify({ v: 2, pages: pages.length }));
  } catch {
    showToast("Не удалось сохранить данные");
  }
}
async function loadShifts() {
  try {
    const metaRaw = await storage.get("courier_shifts_meta");
    if (metaRaw) {
      const meta = JSON.parse(metaRaw);
      let all = [];
      for (let i = 0; i < meta.pages; i++) {
        const raw = await storage.get(`courier_shifts_p${i}`);
        if (!raw) continue;
        const json = await decodePayload(raw);
        all = all.concat(JSON.parse(json));
      }
      shifts = all.map(fromCompactShift);
      lastPageCount = meta.pages;
      return;
    }
    // миграция со старого формата (один ключ, обычный JSON-массив объектов)
    const legacy = await storage.get("courier_shifts");
    if (legacy) {
      shifts = JSON.parse(legacy);
      await persistShifts();       // пересохранить в новом компактном формате
      await storage.remove("courier_shifts");
      return;
    }
    shifts = [];
  } catch {
    shifts = [];
  }
}
async function persistSettings() { try { await storage.set("courier_settings", JSON.stringify(settings)); } catch {} }
async function persistGoal() { try { await storage.set("courier_goal", JSON.stringify(goal)); } catch {} }

function addOrUpdateShift(shift, editingId) {
  if (editingId) shifts = shifts.map(s => s.id===editingId ? shift : s);
  else shifts = [...shifts, shift];
  shifts.sort((a,b) => (a.date+a.start).localeCompare(b.date+b.start));
  persistShiftsDebounced();
  if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
  renderAll();
}
function deleteShift(id) {
  shifts = shifts.filter(s => s.id !== id);
  persistShiftsDebounced();
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
  renderAll();
}

// ===================== TOAST =====================
function showToast(msg, type="error") {
  errorMsg = msg;
  const existing = document.querySelector(".toast");
  if (existing) existing.remove();
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => { el.remove(); errorMsg=""; }, 3000);
}

// ===================== RENDER (fixed-order sections) =====================
const root = document.getElementById("root");

// Порядок закреплён один раз при первом рендере — это чинит баг, когда
// секция, которая то появляется, то исчезает (например "Экономика поездок"
// или блок дней недели), после повторного появления не улетает вниз списка.
const SECTION_ORDER = [
  "header-section", "range-tabs", "period-nav", "main-card",
  "goal-card-section", "last7-section", "weekday-section",
  "economics-section", "list-section",
];
function ensureSections() {
  SECTION_ORDER.forEach(id => {
    if (!document.getElementById(id)) {
      const el = document.createElement("div");
      el.id = id;
      root.appendChild(el);
    }
  });
}

function renderAll() {
  if (loading) {
    root.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text-dim)">Загрузка...</div>`;
    return;
  }
  ensureSections();
  renderHeader();
  renderRangeTabs();
  renderPeriodNav();
  renderMainCard();
  renderGoalCard();
  renderLast7Chart();
  renderWeekdayStats();
  renderEconomics();
  renderShiftList();
  renderFAB();
  attachMainHandlers();
}

function renderHeader() {
  document.getElementById("header-section").innerHTML = `
    <div style="padding:22px 20px 16px;display:flex;justify-content:space-between;align-items:flex-start">
      <div>
        <div style="display:flex;align-items:baseline;gap:8px">
          <span style="font-size:13px;letter-spacing:.08em;color:var(--accent);font-weight:600;text-transform:uppercase">Смены</span>
          <span style="font-size:13px;color:var(--text-faint)">· Яндекс, авто</span>
        </div>
        <div style="font-size:24px;font-weight:700;margin-top:4px">Мой заработок</div>
      </div>
      <button id="btn-settings" class="icon-btn" style="width:36px;height:36px;font-size:16px">⚙</button>
    </div>`;
}

function renderRangeTabs() {
  const el = document.getElementById("range-tabs");
  el.style.cssText = "display:flex;gap:6px;padding:0 20px;margin-bottom:14px";
  el.innerHTML = RANGES.map(r =>
    `<button class="range-btn" data-range="${r.key}" style="flex:1;padding:8px 0;border-radius:10px;border:none;background:${range===r.key?"var(--accent)":"var(--surface)"};color:${range===r.key?"#1A1300":"var(--text-dim)"};font-weight:600;font-size:13px">${r.label}</button>`
  ).join("");
}

function renderPeriodNav() {
  const el = document.getElementById("period-nav");
  if (range === "all") { el.style.display = "none"; el.innerHTML = ""; return; }
  el.style.cssText = "display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:16px;color:var(--text-dim);font-size:13px";
  el.innerHTML = `
    <button id="btn-prev" class="icon-btn">‹</button>
    <span style="min-width:140px;text-align:center;text-transform:capitalize">${periodLabel()}</span>
    <button id="btn-next" class="icon-btn">›</button>`;
}

function renderMainCard() {
  const filtered = getFiltered();
  const prevFiltered = getPrevFiltered();
  const stats = getStats(filtered);
  const comparison = getComparison(filtered, prevFiltered);

  const el = document.getElementById("main-card");
  el.style.cssText = "padding:0 20px;margin-bottom:14px";
  el.innerHTML = `
    <div style="background:linear-gradient(155deg, var(--surface-hi), var(--surface));border-radius:20px;padding:22px 20px;border:1px solid var(--line)">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div>
          <div style="font-size:12px;color:var(--text-dim);margin-bottom:6px;letter-spacing:.04em">ЧИСТЫМИ</div>
          <div class="mono" style="font-size:38px;font-weight:700;color:${stats.net>=0?"var(--text)":"var(--bad)"};letter-spacing:-.02em">${fmtMoney(stats.net)}</div>
        </div>
        ${comparison && comparison.pct!==null ? `
        <div style="display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:8px;background:${comparison.pct>=0?"rgba(79,190,130,.14)":"rgba(225,97,79,.14)"};color:${comparison.pct>=0?"var(--good)":"var(--bad)"};font-size:12px;font-weight:700;margin-top:4px">
          ${comparison.pct>=0?"▲":"▼"} ${fmtPct(comparison.pct)}
        </div>` : ""}
      </div>
      <div style="display:flex;gap:16px;margin-top:14px;flex-wrap:wrap">
        ${miniStat("в час", stats.perHour>0?fmtMoney(stats.perHour):"—")}
        ${miniStat("заказов", stats.orders || "—")}
        ${miniStat("смен", stats.shiftCount || "—")}
      </div>

const SWIPE_OPEN_X = -84;

function closeSwipe(wrap) {
  const row = wrap.querySelector(".shift-row");
  row.style.transition = "transform 0.2s ease";
  row.style.transform = "translateX(0)";
  wrap.classList.remove("open");
}

function closeAllSwipes(except) {
  document.querySelectorAll(".shift-row-wrap.open").forEach(w => { if (w !== except) closeSwipe(w); });
}

function attachSwipeHandlers() {
  document.querySelectorAll(".shift-row-wrap").forEach(wrap => {
    const row = wrap.querySelector(".shift-row");
    let startX = 0, startY = 0, baseX = 0, currentX = 0, dragging = false, isHorizontal = null;

    row.addEventListener("touchstart", (e) => {
      closeAllSwipes(wrap);
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      baseX = wrap.classList.contains("open") ? SWIPE_OPEN_X : 0;
      dragging = true;
      isHorizontal = null;
      row.style.transition = "none";
    }, { passive: true });

    row.addEventListener("touchmove", (e) => {
      if (!dragging) return;
      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;
      if (isHorizontal === null) isHorizontal = Math.abs(dx) > Math.abs(dy) + 4;
      if (!isHorizontal) return;
      e.preventDefault();
      currentX = Math.max(SWIPE_OPEN_X, Math.min(0, baseX + dx));
      row.style.transform = `translateX(${currentX}px)`;
    }, { passive: false });

    row.addEventListener("touchend", () => {
      if (!dragging) return;
      dragging = false;
      row.style.transition = "transform 0.2s ease";
      if (isHorizontal && currentX < SWIPE_OPEN_X / 2) {
        row.style.transform = `translateX(${SWIPE_OPEN_X}px)`;
        wrap.classList.add("open");
      } else {
        row.style.transform = "translateX(0)";
        wrap.classList.remove("open");
      }
      currentX = 0;
    });
  });

  document.addEventListener("touchstart", closeSwipesOutside, { passive: true });
}

function closeSwipesOutside(e) {
  if (!e.target.closest(".shift-row-wrap")) closeAllSwipes();
}

function shiftPeriod(dir) {
  const d = new Date(refDate);
  if (range === "week") d.setDate(d.getDate()+dir*7); else if (range === "month") d.setMonth(d.getMonth()+dir);
  refDate = d;
  renderAll();
}

function validateField(name) {
  const el = document.getElementById(`f-${name}`);
  const hint = document.getElementById(`hint-${name}`);
  if (!el || !hint) return true;
  const visualEl = document.getElementById(`f-${name}-display`) || el;

  visualEl.classList.remove("error");
  hint.classList.remove("error");
  hint.textContent = "";

  const val = el.value.trim();

  switch (name) {
    case "date":
      if (!val) { setError(visualEl, hint, "Выбери дату"); return false; }
      if (val > todayISO()) { setError(visualEl, hint, "Дата не может быть в будущем"); return false; }
      break;
    case "start":
      if (!val) { setError(visualEl, hint, "Укажи время начала"); return false; }
      break;
    case "end": {
      if (!val) { setError(visualEl, hint, "Укажи время окончания"); return false; }
      const start = document.getElementById("f-start").value;
      if (start && val === start) { setError(visualEl, hint, "Начало и конец совпадают — смена 0 минут"); return false; }
      break;
    }
    case "earnings": {
      if (!val) { setError(el, hint, "Введи сумму заработка"); return false; }
      const earnings = parseFloat(val);
      if (isNaN(earnings) || earnings < 0) { setError(el, hint, "Сумма не может быть отрицательной"); return false; }
      if (earnings > 1000000) { setError(el, hint, "Слишком большая сумма"); return false; }
      break;
    }
    case "orders": {
      const orders = parseInt(val);
      if (val && (isNaN(orders) || orders < 0)) { setError(el, hint, "Количество заказов не может быть отрицательным"); return false; }
      if (orders > 10000) { setError(el, hint, "Слишком много заказов"); return false; }
      break;
    }
    case "expenses": {
      const expenses = parseFloat(val);
      if (val && (isNaN(expenses) || expenses < 0)) { setError(el, hint, "Расходы не могут быть отрицательными"); return false; }
      if (expenses > 500000) { setError(el, hint, "Слишком большая сумма расходов"); return false; }
      break;
    }
    case "distance": {
      const distance = parseFloat(val);
      if (val && (isNaN(distance) || distance < 0)) { setError(el, hint, "Пробег не может быть отрицательным"); return false; }
      if (distance > 10000) { setError(el, hint, "Слишком большой пробег за смену"); return false; }
      break;
    }
  }
  return true;
}

function validateAll() {
  const results = ["date","start","end","earnings","orders","expenses","distance"].map(f => validateField(f));
  const allValid = results.every(r => r);
  const errorEl = document.getElementById("f-error");
  if (!allValid) {
    errorEl.style.display = "block";
    errorEl.textContent = "Исправь ошибки в форме";
  } else {
    errorEl.style.display = "none";
  }
  return allValid;
}

function setError(input, hint, msg) {
  input.classList.add("error");
  hint.classList.add("error");
  hint.textContent = msg;
}

          <div class="input-hint">Обычно 3–8 ₽/км в зависимости от машины.</div>
        </div>

        <div style="font-size:12px;color:var(--text-dim);margin:16px 0 10px;letter-spacing:.04em">ДАННЫЕ</div>
        <button class="export-btn" id="btn-export">📥 Скачать резервную копию</button>
        <div class="field">
          <div class="field-label">Загрузить из файла</div>
          <input class="input" type="file" id="s-import" accept=".json" style="padding:8px 12px">
        </div>

        <button class="btn-primary" id="s-submit">Сохранить</button>
      </div>
    </div>`;

  document.getElementById("settings-overlay").addEventListener("click", (e) => { if (e.target.id === "settings-overlay") closeModal(); });
  document.getElementById("settings-close").onclick = closeModal;
  document.getElementById("btn-export").onclick = exportData;
  document.getElementById("s-import").onchange = importData;
  document.getElementById("s-submit").onclick = () => {
    const amortVal = parseFloat(document.getElementById("s-amort").value);
    settings = { amortRate: isNaN(amortVal) || amortVal < 0 ? 0 : amortVal };
    goal = {
      name: document.getElementById("s-goal-name").value.trim(),
      amount: parseFloat(document.getElementById("s-goal-amount").value) || 0
    };
    persistSettings(); persistGoal();
    closeModal();
    renderAll();
  };
}

// ===================== EXPORT / IMPORT =====================
function exportData() {
  const data = { shifts, settings, goal, exportedAt: new Date().toISOString(), version: 1 };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `courier-backup-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("Копия сохранена", "success");
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.shifts || !Array.isArray(data.shifts)) throw new Error("Неверный формат файла");
      shifts = data.shifts;
      if (data.settings) settings = data.settings;
      if (data.goal) goal = data.goal;
      persistShifts(); persistSettings(); persistGoal();
      renderAll();
      showToast("Данные загружены", "success");
      closeModal();
    } catch (err) {
      showToast("Не удалось загрузить файл: " + err.message);
    }
  };
  reader.readAsText(file);
}

function closeModal() { document.getElementById("modal-root").innerHTML = ""; }

// ===================== INIT =====================
(async () => {
  await loadShifts();
  try { const v = await storage.get("courier_settings"); if (v) settings = JSON.parse(v); } catch {}
  try { const v = await storage.get("courier_goal"); if (v) goal = JSON.parse(v); } catch {}
  loading = false;
  renderAll();
})();
</script>
